services:
  goldgen-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: goldgen-automation:latest
    container_name: goldgen-bot
    ports:
      - "18794:18794"
    restart: unless-stopped
    volumes:
      - goldgen_data:/app/data
      - goldgen_images:/app/generated_images
      - goldgen_logs:/app/logs
      - goldgen_motion:/app/motion_studio
    environment:
      - PORT=18794
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Jakarta
      # Render Motion Studio ditangani service goldgen-motion-worker di bawah.
      - MOTION_EMBEDDED_WORKER=false

  goldgen-motion-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: goldgen-automation:latest
    container_name: goldgen-motion-worker
    command: ["python", "motion_worker.py"]
    cpus: 2.0
    mem_limit: 3g
    restart: unless-stopped
    volumes:
      - goldgen_data:/app/data
      - goldgen_images:/app/generated_images
      - goldgen_logs:/app/logs
      - goldgen_motion:/app/motion_studio
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Jakarta
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MOTION_RENDER_CONCURRENCY=1
      - MOTION_RENDER_TIMEOUT=1800

volumes:
  goldgen_data:
  goldgen_images:
  goldgen_logs:
  goldgen_motion:
