<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goldgen Dashboard - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 p-6 sm:p-8 rounded-lg shadow-2xl w-full max-w-md border border-yellow-600">
        <div class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold text-yellow-500 mb-2">🔐 Goldgen Dashboard</h1>
            <p class="text-gray-400 text-sm sm:text-base">Enter PIN to access</p>
        </div>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <input 
                    type="tel" 
                    inputmode="numeric"
                    id="pin" 
                    placeholder="Enter 6-digit PIN"
                    maxlength="6"
                    class="w-full px-4 py-4 bg-gray-700 text-white text-center text-xl sm:text-2xl tracking-widest rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-500 touch-manipulation"
                    autofocus
                >
            </div>
            
            <div id="error" class="hidden text-red-400 text-sm text-center"></div>
            
            <button 
                type="submit"
                class="w-full bg-yellow-600 hover:bg-yellow-700 active:bg-yellow-800 text-white font-bold py-4 rounded-lg transition duration-200 touch-manipulation"
            >
                Login
            </button>
        </form>
        
        <div class="mt-6 text-center text-gray-500 text-xs sm:text-sm">
            <p>Protected Dashboard</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const pinInput = document.getElementById('pin');
        const errorDiv = document.getElementById('error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pin = pinInput.value;

            if (pin.length !== 6) {
                showError('PIN must be 6 digits');
                return;
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin })
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    showError('Invalid PIN');
                    pinInput.value = '';
                }
            } catch (error) {
                showError('Connection error');
            }
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.remove('hidden');
            setTimeout(() => errorDiv.classList.add('hidden'), 3000);
        }

        // Auto-focus and select on input
        pinInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
        });
    </script>
</body>
</html>
